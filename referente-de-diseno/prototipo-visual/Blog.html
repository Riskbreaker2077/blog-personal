<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Camilo Moreno — Blog</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  /* ============== TOKENS ============== */
  :root {
    /* Paleta synthwave — modo claro */
    --cream:        #f7f4ee;
    --cream-2:      #ece5d7;
    --ink:          #17110d;
    --ink-2:        #332720;
    --muted:        rgba(23,17,13,.60);
    --muted-2:      rgba(23,17,13,.38);
    --rule:         rgba(90,60,30,.16);
    --rule-soft:    rgba(90,60,30,.08);
    --accent:       #c41508;  /* rojo */
    --gold:         #d4bb7c;  /* arena */
    --rose:         #9c3a2a;  /* óxido */
    --violet:       #0f4b4b;  /* teal profundo */
    --peri:         #854d27;  /* café */
    --paper:        #f7f4ee;

    /* Fuentes (mutables vía tweaks) */
    --font-serif:   "Newsreader", "Source Serif 4", Georgia, serif;
    --font-mono:    "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;

    /* Densidad */
    --density-row:  1.15rem;
    --density-pad:  1rem;
    --reading-size: 1.125rem;
    --max-content:  680px;

    /* Tonos por categoría — colorean los marcadores */
    --tone-accent:  var(--accent);
    --tone-gold:    var(--gold);
    --tone-ink:     var(--violet);
  }

  /* Modo oscuro — atardecer neón */
  [data-theme="dark"] {
    --cream:        #020609;
    --cream-2:      #0e1417;
    --ink:          #f2ede4;
    --ink-2:        #cfc6ba;
    --muted:        rgba(242,237,228,.56);
    --muted-2:      rgba(242,237,228,.32);
    --rule:         rgba(212,187,124,.18);
    --rule-soft:    rgba(212,187,124,.09);
    --accent:       #e5502f;  /* rojo luminoso */
    --gold:         #d4bb7c;
    --rose:         #c06a4c;
    --violet:       #1f8080;  /* teal luminoso */
    --peri:         #b47a45;  /* café claro */
    --paper:        #020609;
    --tone-ink:     var(--violet);
  }

  /* ============== RESET ============== */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--cream);
    background-image:
      radial-gradient(1100px 480px at 14% -10%, color-mix(in oklab, var(--accent) 16%, transparent), transparent 72%),
      radial-gradient(900px 520px at 88% 108%, color-mix(in oklab, var(--gold) 14%, transparent), transparent 72%),
      radial-gradient(760px 420px at 96% 0%, color-mix(in oklab, var(--violet) 13%, transparent), transparent 74%),
      radial-gradient(700px 380px at 50% -6%, color-mix(in oklab, var(--rose) 10%, transparent), transparent 72%);
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: var(--reading-size);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background-color .4s ease, color .4s ease;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  ::selection { background: var(--accent); color: var(--cream); }

  /* ============== APP SHELL ============== */
  .shell {
    max-width: 920px;
    margin: 0 auto;
    padding: 64px 40px 40px;
    position: relative;
  }
  @media (max-width: 700px) {
    .shell { padding: 40px 22px 32px; }
  }

  /* ============== HEADER / NAV ============== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 72px;
  }
  .brand {
    display: flex; align-items: baseline; gap: 10px;
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 1.05rem;
    letter-spacing: -0.01em;
  }
  .brand-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: linear-gradient(140deg, var(--accent), var(--violet));
    display: inline-block;
    box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 60%, transparent);
    animation: pulse 2.4s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 50%, transparent); }
    70%  { box-shadow: 0 0 0 8px color-mix(in oklab, var(--accent) 0%, transparent); }
    100% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 0%, transparent); }
  }
  .brand-sub {
    font-family: var(--font-mono);
    font-size: .68rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
  }
  .nav {
    display: flex; gap: 22px;
    font-family: var(--font-mono);
    font-size: .78rem;
    letter-spacing: .02em;
  }
  .nav button {
    position: relative;
    color: var(--muted);
    padding: 4px 0;
    transition: color .2s;
  }
  .nav button:hover { color: var(--ink); }
  .nav button.is-active { color: var(--ink); }
  .nav button.is-active::after {
    content: ""; position: absolute;
    left: 0; right: 0; bottom: -2px;
    height: 2px; background: var(--accent);
    border-radius: 1px;
  }

  /* ============== HERO (HOME) ============== */
  .hero {
    margin-bottom: 48px;
    max-width: 720px;
  }
  .hero h1 {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: clamp(2.4rem, 5.5vw, 3.6rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0 0 28px;
    text-wrap: balance;
  }
  .hero h1 .em {
    font-style: italic;
    color: var(--accent);
    position: relative;
  }
  .hero h1 .em::after {
    content: "";
    position: absolute;
    left: -2px; right: -2px; bottom: 6px;
    height: 8px;
    background: linear-gradient(90deg, color-mix(in oklab, var(--accent) 50%, transparent), color-mix(in oklab, var(--violet) 45%, transparent) 55%, color-mix(in oklab, var(--gold) 55%, transparent));
    z-index: -1;
    border-radius: 2px;
    transform: skew(-6deg, -1deg);
  }
  .hero p {
    font-size: 1.18rem;
    line-height: 1.55;
    color: var(--ink-2);
    margin: 0;
    max-width: 560px;
    text-wrap: pretty;
  }
  .hero-meta {
    margin-top: 28px;
    display: flex; gap: 18px;
    font-family: var(--font-mono);
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
  }
  .hero-meta span::before {
    content: "—  ";
    color: var(--muted-2);
  }
  .hero-meta span:first-child::before { content: ""; }

  /* ============== FILTROS ============== */
  .filter-row {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 36px;
    font-family: var(--font-mono);
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .filter-row > .filter-label { color: var(--muted-2); margin-right: 4px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px 5px 9px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    color: var(--muted);
    cursor: pointer;
    transition: all .2s ease;
    background: transparent;
  }
  .chip:hover { color: var(--ink); border-color: color-mix(in oklab, var(--ink) 28%, transparent); }
  .chip .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted-2);
  }
  .chip.is-on { color: var(--ink); border-color: var(--ink); }
  .chip[data-tone="accent"] .dot { background: var(--tone-accent); }
  .chip[data-tone="gold"]   .dot { background: var(--tone-gold); }
  .chip[data-tone="ink"]    .dot { background: var(--tone-ink); }

  /* ============== TIMELINE ============== */
  .timeline {
    position: relative;
    /* Vertical rule */
  }
  .timeline::before {
    content: "";
    position: absolute;
    left: 102px;
    top: 6px; bottom: 0;
    width: 1px;
    background: linear-gradient(to bottom, transparent 0, color-mix(in oklab, var(--accent) 60%, transparent) 18px, color-mix(in oklab, var(--peri) 45%, transparent) 55%, color-mix(in oklab, var(--gold) 45%, transparent) calc(100% - 80px), transparent 100%);
  }
  @media (max-width: 700px) {
    .timeline::before { left: 78px; }
  }

  .year {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 24px;
    align-items: baseline;
    margin: 56px 0 22px;
    position: relative;
  }
  @media (max-width: 700px) { .year { grid-template-columns: 66px 1fr; gap: 16px; } }
  .year:first-child { margin-top: 0; }
  .year-num {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: 2.6rem;
    line-height: 1;
    letter-spacing: -.02em;
    color: var(--ink);
    font-feature-settings: "lnum";
  }
  @media (max-width: 700px) { .year-num { font-size: 2rem; } }
  .year-caption {
    font-family: var(--font-mono);
    font-size: .68rem;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted-2);
    padding-left: 24px;
    border-left: 1px solid var(--rule);
  }

  /* Post row */
  .row {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 24px;
    padding: var(--density-row) 0;
    border-bottom: 1px dashed var(--rule);
    position: relative;
    cursor: pointer;
    transition: padding .25s ease;
  }
  @media (max-width: 700px) { .row { grid-template-columns: 66px 1fr; gap: 16px; } }
  .row:last-child { border-bottom: 0; }

  .row-date {
    font-family: var(--font-mono);
    font-size: .72rem;
    color: var(--muted);
    padding-top: 6px;
    letter-spacing: .02em;
    font-variant-numeric: tabular-nums;
    text-align: right;
    position: relative;
  }
  /* the dot marker — sits on the vertical rule */
  .row-marker {
    position: absolute;
    left: calc(102px - 5px);
    top: 50%;
    transform: translateY(-50%);
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--paper);
    border: 2px solid var(--muted-2);
    transition: all .25s ease;
    z-index: 1;
  }
  @media (max-width: 700px) { .row-marker { left: calc(78px - 5px); } }
  .row[data-tone="accent"] .row-marker { border-color: var(--tone-accent); }
  .row[data-tone="gold"]   .row-marker { border-color: var(--tone-gold); }
  .row[data-tone="ink"]    .row-marker { border-color: var(--tone-ink); }

  .row-body {
    padding-left: 24px;
  }
  .row-title {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 1.42rem;
    line-height: 1.2;
    letter-spacing: -.015em;
    margin: 0 0 6px;
    color: var(--ink);
    transition: transform .25s ease;
    transform-origin: left center;
  }
  .row-excerpt {
    font-size: .98rem;
    line-height: 1.5;
    color: var(--ink-2);
    margin: 0 0 10px;
    max-width: 580px;
    text-wrap: pretty;
    opacity: .78;
    transition: opacity .25s ease;
  }
  .row-meta {
    display: flex; gap: 14px;
    font-family: var(--font-mono);
    font-size: .68rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
  }
  .row-meta .cat[data-tone="accent"] { color: var(--accent); }
  .row-meta .cat[data-tone="gold"]   { color: var(--gold); }

  /* Hover */
  .row:hover .row-marker {
    transform: translateY(-50%) scale(1.45);
    background: currentColor;
  }
  .row[data-tone="accent"]:hover .row-marker { background: var(--accent); }
  .row[data-tone="gold"]:hover   .row-marker { background: var(--gold); }
  .row[data-tone="ink"]:hover    .row-marker { background: var(--tone-ink); }
  .row[data-tone="accent"]:hover .row-marker { box-shadow: 0 0 0 6px color-mix(in oklab, var(--accent) 22%, transparent); }
  .row[data-tone="gold"]:hover   .row-marker { box-shadow: 0 0 0 6px color-mix(in oklab, var(--gold) 22%, transparent); }
  .row[data-tone="ink"]:hover    .row-marker { box-shadow: 0 0 0 6px color-mix(in oklab, var(--tone-ink) 22%, transparent); }
  .row:hover .row-title { transform: translateX(4px); }
  .row:hover .row-excerpt { opacity: 1; }
  .row:hover .row-date { color: var(--ink); }

  /* Densidad — controlada por tweak */
  [data-density="compact"] { --density-row: .7rem; --reading-size: 1.05rem; }
  [data-density="relaxed"] { --density-row: 1.7rem; --reading-size: 1.18rem; }

  /* ============== POST PAGE ============== */
  .post {
    max-width: var(--max-content);
    margin: 0 auto;
    position: relative;
  }
  .post-head {
    margin-bottom: 48px;
  }
  .post-eyebrow {
    display: flex; gap: 14px; align-items: center;
    font-family: var(--font-mono);
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
    margin-bottom: 22px;
  }
  .post-eyebrow .pill {
    padding: 3px 9px;
    border: 1px solid currentColor;
    border-radius: 999px;
  }
  .post-eyebrow .pill[data-tone="accent"] { color: var(--accent); }
  .post-eyebrow .pill[data-tone="gold"]   { color: var(--gold); }
  .post h1.post-title {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: clamp(2rem, 4.5vw, 2.9rem);
    line-height: 1.08;
    letter-spacing: -.02em;
    margin: 0 0 18px;
    text-wrap: balance;
  }
  .post-lede {
    font-size: 1.22rem;
    line-height: 1.5;
    color: var(--ink-2);
    margin: 0;
    font-style: italic;
    text-wrap: pretty;
  }
  .post-body p {
    margin: 0 0 1.2em;
    text-wrap: pretty;
  }
  .post-body p:first-letter {
    /* drop-cap solo en el primer párrafo */
  }
  .post-body .lede + p:first-of-type::first-letter,
  .post-body > p:first-child::first-letter {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 3.4em;
    line-height: .9;
    float: left;
    padding: 6px 10px 0 0;
    color: var(--accent);
  }
  .post-body h2 {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 1.55rem;
    line-height: 1.2;
    letter-spacing: -.015em;
    margin: 56px 0 18px;
    position: relative;
  }
  .post-body h2::before {
    content: "§";
    position: absolute;
    left: -28px;
    color: var(--accent);
    font-weight: 400;
    font-style: italic;
  }
  .post-body .pull {
    margin: 40px 0;
    padding: 16px 0 16px 24px;
    border-left: 3px solid var(--accent);
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 1.32rem;
    line-height: 1.35;
    color: var(--ink);
    text-wrap: pretty;
  }
  .post-body .note {
    position: relative;
    border-bottom: 1px dotted var(--accent);
    cursor: help;
  }
  .post-body .note::after {
    content: attr(data-note);
    position: absolute;
    left: 50%; bottom: calc(100% + 8px);
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--cream);
    font-family: var(--font-mono);
    font-size: .68rem;
    line-height: 1.4;
    padding: 7px 10px;
    border-radius: 4px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 30;
  }
  .post-body .note:hover::after { opacity: 1; transform: translateX(-50%) translateY(-2px); }

  .post-foot {
    margin-top: 64px;
    padding-top: 32px;
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    gap: 24px;
    font-family: var(--font-mono);
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
  }
  .post-foot a { transition: color .2s; }
  .post-foot a:hover { color: var(--accent); }

  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono);
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin-bottom: 40px;
    transition: color .2s, gap .2s;
  }
  .back-link:hover { color: var(--accent); gap: 12px; }

  /* Reading progress */
  .progress {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--violet) 50%, var(--gold));
    z-index: 100;
    transition: width .1s linear;
    will-change: width;
  }

  /* ============== ABOUT ============== */
  .about-grid {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 56px;
    max-width: 820px;
  }
  @media (max-width: 700px) { .about-grid { grid-template-columns: 1fr; gap: 32px; } }
  .portrait {
    aspect-ratio: 3/4;
    background:
      repeating-linear-gradient(135deg, var(--cream-2) 0 8px, transparent 8px 16px),
      var(--cream-2);
    border: 1px solid var(--rule);
    border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono);
    font-size: .65rem;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--muted-2);
    text-align: center;
    padding: 12px;
  }
  .about-body h1 {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: 2.4rem;
    line-height: 1.1;
    margin: 0 0 24px;
    letter-spacing: -.02em;
  }
  .about-body h1 em { color: var(--accent); }
  .about-body p {
    margin: 0 0 1em;
    color: var(--ink-2);
    text-wrap: pretty;
  }
  .about-facts {
    margin-top: 28px;
    border-top: 1px solid var(--rule);
    padding-top: 20px;
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 8px 24px;
    font-family: var(--font-mono);
    font-size: .8rem;
  }
  .about-facts dt { color: var(--muted); text-transform: uppercase; font-size: .68rem; letter-spacing: .08em; padding-top: 3px; }
  .about-facts dd { margin: 0; }

  /* ============== NOW PAGE ============== */
  .now-head {
    max-width: 720px;
    margin-bottom: 56px;
  }
  .now-head h1 {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: clamp(2rem, 4.5vw, 2.8rem);
    margin: 0 0 14px;
    line-height: 1.1;
    letter-spacing: -.02em;
  }
  .now-head h1 em { color: var(--accent); }
  .now-head .stamp {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--font-mono);
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    padding: 5px 10px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    margin-bottom: 22px;
  }
  .now-head .stamp .blip { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
  .now-head p { color: var(--ink-2); margin: 14px 0 0; max-width: 560px; }

  .now-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 40px 56px;
    max-width: 820px;
  }
  @media (max-width: 700px) { .now-grid { grid-template-columns: 1fr; gap: 36px; } }
  .now-block h3 {
    font-family: var(--font-mono);
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
    margin: 0 0 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--rule);
    display: flex; align-items: center; gap: 8px;
  }
  .now-block h3::before {
    content: "";
    width: 6px; height: 6px;
    background: var(--accent);
    display: inline-block;
  }
  .now-block:nth-child(2) h3::before { background: var(--gold); }
  .now-block:nth-child(3) h3::before { background: var(--ink); }
  .now-block:nth-child(4) h3::before { background: var(--accent); transform: rotate(45deg); }

  .now-block ul {
    list-style: none;
    margin: 0; padding: 0;
    display: flex; flex-direction: column; gap: 10px;
  }
  .now-block li {
    font-family: var(--font-serif);
    font-size: 1.02rem;
    line-height: 1.45;
    color: var(--ink-2);
    padding-left: 18px;
    position: relative;
    text-wrap: pretty;
  }
  .now-block li::before {
    content: "→";
    position: absolute;
    left: 0; top: 0;
    color: var(--muted-2);
    font-family: var(--font-mono);
    font-size: .9rem;
  }

  /* ============== PROJECTS ============== */
  .projects-head {
    max-width: 720px;
    margin-bottom: 48px;
  }
  .projects-head h1 {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: clamp(2rem, 4.5vw, 2.8rem);
    margin: 0 0 14px;
    letter-spacing: -.02em;
  }
  .projects-head h1 em { color: var(--accent); }
  .projects-head p { color: var(--ink-2); margin: 0; max-width: 560px; }
  .project-row {
    display: grid;
    grid-template-columns: 1fr 140px;
    gap: 28px;
    padding: 28px 0;
    border-bottom: 1px solid var(--rule);
    align-items: start;
  }
  @media (max-width: 700px) { .project-row { grid-template-columns: 1fr; gap: 8px; } }
  .project-row h3 {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 1.35rem;
    line-height: 1.2;
    margin: 0 0 6px;
    letter-spacing: -.015em;
  }
  .project-row p {
    margin: 0;
    color: var(--ink-2);
    font-size: 1rem;
    line-height: 1.5;
    max-width: 540px;
  }
  .project-row .side {
    text-align: right;
    font-family: var(--font-mono);
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    line-height: 1.7;
  }
  @media (max-width: 700px) { .project-row .side { text-align: left; } }
  .project-row .status {
    display: inline-flex; align-items: center; gap: 6px;
  }
  .project-row .status::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted-2);
  }
  .project-row .status[data-s="activo"]    { color: var(--accent); }
  .project-row .status[data-s="activo"]::before    { background: var(--accent); animation: pulse 2s infinite; }
  .project-row .status[data-s="publicado"]  { color: var(--ink); }
  .project-row .status[data-s="publicado"]::before  { background: var(--ink); }
  .project-row .status[data-s="lento"]      { color: var(--gold); }
  .project-row .status[data-s="lento"]::before      { background: var(--gold); }
  .project-row .status[data-s="planeado"]   { color: var(--muted); }
  .project-row .status[data-s="planeado"]::before   { background: transparent; border: 1px dashed var(--muted); }

  /* ============== ARCHIVE ============== */
  .archive-head {
    margin-bottom: 48px;
    max-width: 720px;
  }
  .archive-head h1 {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: clamp(2rem, 4.5vw, 2.8rem);
    margin: 0 0 14px;
    letter-spacing: -.02em;
  }
  .archive-head h1 em { color: var(--accent); }
  .archive-head p { color: var(--ink-2); margin: 0; }
  .archive-section {
    margin-bottom: 48px;
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 24px;
  }
  @media (max-width: 700px) { .archive-section { grid-template-columns: 60px 1fr; gap: 14px; } }
  .archive-section .yr {
    font-family: var(--font-serif);
    font-size: 1.8rem;
    line-height: 1;
    letter-spacing: -.02em;
    color: var(--muted);
    padding-top: 4px;
  }
  .archive-section ul { list-style: none; margin: 0; padding: 0; }
  .archive-section li {
    display: grid;
    grid-template-columns: 70px 1fr auto;
    gap: 16px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--rule);
    align-items: baseline;
    cursor: pointer;
    transition: padding .2s;
  }
  .archive-section li:hover { padding-left: 8px; }
  .archive-section li:hover .a-title { color: var(--accent); }
  .archive-section .a-date {
    font-family: var(--font-mono);
    font-size: .7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .archive-section .a-title {
    font-family: var(--font-serif);
    font-size: 1.05rem;
    line-height: 1.3;
    transition: color .2s;
  }
  .archive-section .a-tag {
    font-family: var(--font-mono);
    font-size: .65rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted-2);
  }


  /* ============== PUNTUACIÓN EN COLOR ============== */
  .punct { color: var(--rose); }

  /* ============== ESPACIOS PARA IMAGEN ============== */
  .hero-wrap { display: grid; grid-template-columns: 1fr 224px; gap: 44px; align-items: end; }
  @media (max-width: 760px) { .hero-wrap { grid-template-columns: 1fr; gap: 28px; } .hero-figure { max-width: 224px; } }
  .hero-figure, .post-cover, .post-figure, .portrait-figure { margin: 0; }
  .img-frame { position: relative; padding: 1px; border-radius: 10px; background: linear-gradient(150deg, color-mix(in oklab, var(--accent) 50%, transparent), color-mix(in oklab, var(--violet) 45%, transparent) 55%, color-mix(in oklab, var(--gold) 40%, transparent) 100%); box-shadow: 0 20px 40px -28px color-mix(in oklab, var(--violet) 45%, transparent); }
  .img-frame > image-slot { display: block; width: 100%; height: 100%; border-radius: 13px; overflow: hidden; }
  .img-caption { margin-top: 8px; font-family: var(--font-mono); font-size: .62rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted-2); }
  .post-cover { margin: 0 0 44px; }
  .post-figure { width: min(100%, 760px); margin: 44px 0; }
  .year-num { color: var(--ink); }

  /* ============== FOOTER ============== */
  .footer {
    margin-top: 40px;
    padding-top: 24px;
    padding-bottom: 4px;
    border-top: 1px solid transparent;
    border-image: linear-gradient(90deg, color-mix(in oklab, var(--accent) 45%, transparent), color-mix(in oklab, var(--violet) 45%, transparent) 55%, color-mix(in oklab, var(--gold) 45%, transparent)) 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    gap: 24px;
    flex-wrap: wrap;
  }
  .footer .colophon { max-width: 320px; line-height: 1.6; text-transform: none; letter-spacing: 0; font-family: var(--font-serif); font-style: italic; font-size: .9rem; color: var(--muted); }

  /* ============== LIFE STYLE — extras ============== */
  /* Cursor follower (life=playful) */
  .cursor-ring {
    position: fixed;
    width: 28px; height: 28px;
    border: 1px solid var(--accent);
    border-radius: 50%;
    pointer-events: none;
    z-index: 200;
    transform: translate(-50%, -50%);
    transition: width .2s, height .2s, opacity .2s;
    mix-blend-mode: difference;
    opacity: 0;
  }
  body[data-life="playful"] .cursor-ring { opacity: .6; }
  body[data-life="playful"] .cursor-ring.hover { width: 44px; height: 44px; opacity: 1; }

  /* Marginalia (life=playful) */
  .marginalia {
    display: none;
    position: absolute;
    left: calc(100% + 32px);
    width: 180px;
    font-family: var(--font-mono);
    font-size: .68rem;
    line-height: 1.5;
    color: var(--muted);
    text-transform: none;
    letter-spacing: 0;
  }
  body[data-life="playful"] .marginalia { display: block; }
  @media (max-width: 1100px) { .marginalia { display: none !important; } }

  body[data-life="off"] .brand-dot,
  body[data-life="off"] .now-head .stamp .blip,
  body[data-life="off"] .project-row .status[data-s="activo"]::before { animation: none; }
  body[data-life="off"] .hero h1 .em::after { display: none; }
  body[data-life="off"] .row:hover .row-marker { transform: translateY(-50%); }

  /* Fade-in on screen change */
  .screen {
    animation: fadeIn .35s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Theme toggle button in nav */
  .theme-toggle {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted);
    transition: all .2s;
    font-size: .9rem;
  }
  .theme-toggle:hover { color: var(--ink); border-color: var(--ink); }
</style>
</head>
<body>
  <div id="cursor-ring" class="cursor-ring"></div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="image-slot.js"></script>
  <script src="data.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
